<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Almond | Luxury Clothing</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --dark-green: #002E2C;
            --sage-green: #7A8C7B;
            --gold: #C1A86E;
            --cream: #FAF7F0;
            --charcoal: #2F2F2F;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            color: var(--charcoal);
            background-color: var(--cream);
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        
        .serif {
            font-family: 'Cormorant Garamond', serif;
        }
        
        .text-dark-green { color: var(--dark-green); }
        .bg-dark-green { background-color: var(--dark-green); }
        .text-sage-green { color: var(--sage-green); }
        .bg-sage-green { background-color: var(--sage-green); }
        .text-gold { color: var(--gold); }
        .bg-gold { background-color: var(--gold); }
        .text-cream { color: var(--cream); }
        .bg-cream { background-color: var(--cream); }
        .text-charcoal { color: var(--charcoal); }
        .bg-charcoal { background-color: var(--charcoal); }
        
        .luxury-border {
            border: 1px solid rgba(193, 168, 110, 0.2);
        }
        
        .luxury-shadow {
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }
        
        .hover-lift {
            transition: all 0.3s ease;
        }
        .hover-lift:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
        }
        
        /* Fade in from left animations */
        .fade-in-left {
            opacity: 0;
            transform: translateX(-50px);
            animation: fadeInLeft 0.8s ease forwards;
        }
        
        @keyframes fadeInLeft {
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        .fade-in-right {
            opacity: 0;
            transform: translateX(50px);
            animation: fadeInRight 0.8s ease forwards;
        }
        
        @keyframes fadeInRight {
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        .fade-in-up {
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 0.8s ease forwards;
        }
        
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* Staggered animations for children */
        .stagger-children > * {
            opacity: 0;
            transform: translateX(-30px);
            animation: fadeInLeft 0.6s ease forwards;
        }
        
        .stagger-children > *:nth-child(1) { animation-delay: 0.1s; }
        .stagger-children > *:nth-child(2) { animation-delay: 0.2s; }
        .stagger-children > *:nth-child(3) { animation-delay: 0.3s; }
        .stagger-children > *:nth-child(4) { animation-delay: 0.4s; }
        .stagger-children > *:nth-child(5) { animation-delay: 0.5s; }
        .stagger-children > *:nth-child(6) { animation-delay: 0.6s; }
        
        .btn-luxury {
            background: linear-gradient(135deg, var(--dark-green), var(--sage-green));
            color: white;
            transition: all 0.3s ease;
        }
        
        .btn-luxury:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }
        
        .btn-gold {
            background: linear-gradient(135deg, var(--gold), #d4b87a);
            color: var(--dark-green);
            transition: all 0.3s ease;
        }
        
        .btn-gold:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(193, 168, 110, 0.3);
        }
        
        /* Product card specific styles */
        .product-card {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        
        .product-card-content {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        
        .product-card-actions {
            margin-top: auto;
            padding-top: 1rem;
        }
        
        /* Product detail page styles */
        .product-gallery {
            position: relative;
        }
        
        .product-thumbnails {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
        }
        
        .product-thumbnail {
            width: 60px;
            height: 60px;
            object-fit: cover;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }
        
        .product-thumbnail.active {
            border-color: var(--gold);
        }
        
        .size-option {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--sage-green);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .size-option.selected {
            background-color: var(--dark-green);
            color: var(--cream);
            border-color: var(--dark-green);
        }
        
        .color-option {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }
        
        .color-option.selected {
            border-color: var(--gold);
            transform: scale(1.1);
        }
        
        /* Admin Dashboard Styles */
        .admin-sidebar {
            width: 250px;
            background: var(--dark-green);
            color: var(--cream);
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            transition: all 0.3s ease;
        }
        
        .admin-main {
            margin-left: 250px;
            padding: 20px;
            transition: all 0.3s ease;
        }
        
        .stat-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
        }
        
        /* Payment Processing Styles */
        .payment-method {
            border: 2px solid var(--sage-green);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .payment-method.selected {
            border-color: var(--gold);
            background-color: rgba(193, 168, 110, 0.1);
        }
        
        .payment-method:hover {
            border-color: var(--gold);
        }
        
        .payment-loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-cream">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [currentPage, setCurrentPage] = useState('home');
            const [cart, setCart] = useState([]);
            const [selectedProduct, setSelectedProduct] = useState(null);
            const [isAdmin, setIsAdmin] = useState(false);
            const [orders, setOrders] = useState([]);
            
            // Initialize with sample orders if none exist
            useEffect(() => {
                const savedOrders = localStorage.getItem('almond_orders');
                if (savedOrders) {
                    setOrders(JSON.parse(savedOrders));
                } else {
                    // Sample orders for demo
                    const sampleOrders = [
                        {
                            id: 'ORD-001',
                            date: '2024-01-15',
                            customer: 'Eleanor Smith',
                            email: 'eleanor@example.com',
                            total: 1299,
                            status: 'delivered',
                            items: [
                                { name: 'Classic Cashmere Coat', price: 1299, quantity: 1 }
                            ]
                        },
                        {
                            id: 'ORD-002',
                            date: '2024-01-18',
                            customer: 'James Wilson',
                            email: 'james@example.com',
                            total: 1349,
                            status: 'processing',
                            items: [
                                { name: 'Silk Evening Gown', price: 899, quantity: 1 },
                                { name: 'Cashmere Sweater', price: 450, quantity: 1 }
                            ]
                        }
                    ];
                    setOrders(sampleOrders);
                    localStorage.setItem('almond_orders', JSON.stringify(sampleOrders));
                }
            }, []);
            
            // Sample products with more details
            const products = [
                {
                    id: 1,
                    name: "Classic Cashmere Coat",
                    price: 1299,
                    category: "outerwear",
                    images: [
                        "https://images.unsplash.com/photo-1591047139829-d91aecb6caea?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80",
                        "https://images.unsplash.com/photo-1591047139829-d91aecb6caea?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80",
                        "https://images.unsplash.com/photo-1591047139829-d91aecb6caea?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80"
                    ],
                    description: "Luxurious cashmere coat with a timeless silhouette. Crafted from the finest Mongolian cashmere, this coat offers exceptional warmth without weight.",
                    fullDescription: "Our Classic Cashmere Coat is the epitome of timeless luxury. Made from 100% Mongolian cashmere, it features a tailored fit, notched lapel, and hidden button closure. The fully lined interior ensures comfort and durability, while the two front pockets add both style and functionality. Perfect for both formal occasions and everyday elegance.",
                    sizes: ["XS", "S", "M", "L", "XL"],
                    colors: [
                        { name: "Navy", value: "#002E2C" },
                        { name: "Camel", value: "#C1A86E" },
                        { name: "Black", value: "#2F2F2F" },
                        { name: "Grey", value: "#7A8C7B" }
                    ],
                    details: [
                        "100% Mongolian cashmere",
                        "Fully lined with silk",
                        "Hidden button closure",
                        "Two front pockets",
                        "Dry clean only"
                    ],
                    care: "Dry clean only. Do not bleach. Iron on low heat. Store in a cool, dry place.",
                    inventory: 15
                },
                {
                    id: 2,
                    name: "Silk Evening Gown",
                    price: 899,
                    category: "dresses",
                    images: [
                        "https://images.unsplash.com/photo-1566479179816-d72d4cbe0175?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80",
                        "https://images.unsplash.com/photo-1566479179816-d72d4cbe0175?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80",
                        "https://images.unsplash.com/photo-1566479179816-d72d4cbe0175?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80"
                    ],
                    description: "Elegant silk gown for special occasions. Flowing silhouette with delicate details.",
                    fullDescription: "The Silk Evening Gown is a masterpiece of elegance and sophistication. Crafted from the finest mulberry silk, it drapes beautifully and feels luxurious against the skin. The gown features a subtle A-line silhouette, delicate cap sleeves, and a back keyhole detail. Perfect for galas, weddings, and other special occasions where you want to make a lasting impression.",
                    sizes: ["XS", "S", "M", "L"],
                    colors: [
                        { name: "Ivory", value: "#FAF7F0" },
                        { name: "Black", value: "#2F2F2F" },
                        { name: "Burgundy", value: "#800020" }
                    ],
                    details: [
                        "100% mulberry silk",
                        "Hidden back zipper",
                        "Lined bodice",
                        "Hand-finished details",
                        "Dry clean only"
                    ],
                    care: "Dry clean only. Store hanging in a garment bag. Avoid direct sunlight.",
                    inventory: 8
                },
                {
                    id: 3,
                    name: "Tailored Wool Trousers",
                    price: 450,
                    category: "bottoms",
                    images: [
                        "https://images.unsplash.com/photo-1594633312681-425c7b97ccd1?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80",
                        "https://images.unsplash.com/photo-1594633312681-425c7b97ccd1?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80",
                        "https://images.unsplash.com/photo-1594633312681-425c7b97ccd1?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80"
                    ],
                    description: "Perfectly tailored trousers in premium wool. Classic fit with modern details.",
                    fullDescription: "Our Tailored Wool Trousers combine classic tailoring with contemporary comfort. Made from premium Italian wool, they feature a straight leg silhouette, front pleats, and a comfortable waistband. The hidden side adjusters allow for a perfect fit, while the functional back pockets add practicality. These trousers are versatile enough for both office wear and sophisticated casual occasions.",
                    sizes: ["30", "32", "34", "36", "38"],
                    colors: [
                        { name: "Charcoal", value: "#2F2F2F" },
                        { name: "Navy", value: "#002E2C" },
                        { name: "Cream", value: "#FAF7F0" }
                    ],
                    details: [
                        "100% Italian wool",
                        "Front pleats",
                        "Hidden side adjusters",
                        "Functional back pockets",
                        "Professional dry clean"
                    ],
                    care: "Professional dry clean only. Press with steam. Do not tumble dry.",
                    inventory: 22
                }
            ];
            
            const addToCart = (product, selectedOptions = {}) => {
                const productWithOptions = {
                    ...product,
                    selectedSize: selectedOptions.size || product.sizes[0],
                    selectedColor: selectedOptions.color || product.colors[0].name,
                    quantity: selectedOptions.quantity || 1
                };
                setCart([...cart, productWithOptions]);
                
                // Show notification
                const notification = document.createElement('div');
                notification.className = 'fixed top-4 right-4 bg-dark-green text-cream px-4 py-2 rounded luxury-shadow z-50 fade-in-up';
                notification.innerHTML = `<i class="fas fa-check mr-2"></i> ${product.name} added to cart!`;
                document.body.appendChild(notification);
                
                setTimeout(() => {
                    notification.remove();
                }, 3000);
            };
            
            const viewProductDetails = (product) => {
                setSelectedProduct(product);
                setCurrentPage('product-detail');
            };
            
            // Admin login function
            const handleAdminLogin = () => {
                // In a real app, this would have proper authentication
                setIsAdmin(true);
                setCurrentPage('admin-dashboard');
            };
            
            // Navigation
            const Navigation = () => (
                <header className="bg-dark-green text-cream sticky top-0 z-50 luxury-border-b fade-in-down">
                    <div className="container mx-auto px-4 py-4">
                        <div className="flex justify-between items-center">
                            <div className="serif text-2xl font-bold cursor-pointer fade-in-left" onClick={() => setCurrentPage('home')}>
                                Almond
                            </div>
                            <nav className="hidden md:flex space-x-8 stagger-children">
                                {['home', 'shop', 'about', 'contact'].map(page => (
                                    <button
                                        key={page}
                                        className={`serif text-lg hover:text-gold transition-colors ${currentPage === page ? 'text-gold' : ''}`}
                                        onClick={() => setCurrentPage(page)}
                                    >
                                        {page.charAt(0).toUpperCase() + page.slice(1)}
                                    </button>
                                ))}
                                {isAdmin && (
                                    <button
                                        className="serif text-lg hover:text-gold transition-colors text-gold"
                                        onClick={() => setCurrentPage('admin-dashboard')}
                                    >
                                        Admin
                                    </button>
                                )}
                            </nav>
                            <div className="flex items-center space-x-6 stagger-children">
                                {!isAdmin && (
                                    <button 
                                        className="hover:text-gold transition-colors"
                                        onClick={handleAdminLogin}
                                    >
                                        <i className="fas fa-lock"></i>
                                    </button>
                                )}
                                <button className="hover:text-gold transition-colors">
                                    <i className="fas fa-user"></i>
                                </button>
                                <button 
                                    className="relative hover:text-gold transition-colors"
                                    onClick={() => setCurrentPage('cart')}
                                >
                                    <i className="fas fa-shopping-bag"></i>
                                    {cart.length > 0 && (
                                        <span className="absolute -top-2 -right-2 bg-gold text-dark-green text-xs rounded-full w-5 h-5 flex items-center justify-center">
                                            {cart.length}
                                        </span>
                                    )}
                                </button>
                                <button className="md:hidden">
                                    <i className="fas fa-bars"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </header>
            );
            
            // Product Card Component
            const ProductCard = ({ product, index }) => (
                <div 
                    className="product-card bg-white rounded-lg overflow-hidden luxury-shadow luxury-border hover-lift fade-in-left cursor-pointer"
                    style={{animationDelay: `${index * 0.2}s`}}
                    onClick={() => viewProductDetails(product)}
                >
                    <div className="h-80 overflow-hidden">
                        <img 
                            src={product.images[0]} 
                            alt={product.name} 
                            className="w-full h-full object-cover transition-transform duration-500 hover:scale-105"
                        />
                    </div>
                    <div className="p-6 product-card-content">
                        <div>
                            <h3 className="serif text-xl text-charcoal mb-2">{product.name}</h3>
                            <p className="text-sage-green mb-4">{product.description}</p>
                        </div>
                        <div className="product-card-actions">
                            <div className="flex justify-between items-center">
                                <span className="serif text-2xl text-dark-green">${product.price}</span>
                                <button 
                                    className="btn-luxury px-4 py-2 rounded hover:bg-opacity-90 transition-colors"
                                    onClick={(e) => {
                                        e.stopPropagation();
                                        addToCart(product);
                                    }}
                                >
                                    <i className="fas fa-plus mr-1"></i> Add to Cart
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
            
            // Payment Processing Component
            const PaymentProcessing = ({ orderTotal, onPaymentSuccess, onBack }) => {
                const [paymentMethod, setPaymentMethod] = useState('card');
                const [isProcessing, setIsProcessing] = useState(false);
                const [cardDetails, setCardDetails] = useState({
                    number: '',
                    expiry: '',
                    cvv: '',
                    name: ''
                });
                
                const handlePayment = async () => {
                    setIsProcessing(true);
                    
                    // Simulate payment processing
                    setTimeout(() => {
                        setIsProcessing(false);
                        // In a real app, this would integrate with Stripe, PayPal, etc.
                        onPaymentSuccess();
                    }, 3000);
                };
                
                return (
                    <div className="max-w-2xl mx-auto fade-in-left">
                        <h2 className="serif text-3xl text-charcoal mb-6">Payment Information</h2>
                        
                        <div className="bg-white p-6 rounded-lg luxury-shadow luxury-border mb-6">
                            <h3 className="serif text-xl text-charcoal mb-4">Select Payment Method</h3>
                            
                            <div className="space-y-4">
                                <div 
                                    className={`payment-method ${paymentMethod === 'card' ? 'selected' : ''}`}
                                    onClick={() => setPaymentMethod('card')}
                                >
                                    <div className="flex items-center">
                                        <i className="fas fa-credit-card text-gold text-xl mr-3"></i>
                                        <div>
                                            <h4 className="serif text-lg text-charcoal">Credit/Debit Card</h4>
                                            <p className="text-sage-green">Pay with Visa, Mastercard, or American Express</p>
                                        </div>
                                    </div>
                                    
                                    {paymentMethod === 'card' && (
                                        <div className="mt-4 space-y-4">
                                            <div>
                                                <label className="block text-charcoal mb-2">Card Number</label>
                                                <input 
                                                    type="text" 
                                                    placeholder="1234 5678 9012 3456"
                                                    className="w-full px-4 py-2 border border-sage-green rounded focus:outline-none focus:border-gold"
                                                    value={cardDetails.number}
                                                    onChange={(e) => setCardDetails({...cardDetails, number: e.target.value})}
                                                />
                                            </div>
                                            <div className="grid grid-cols-2 gap-4">
                                                <div>
                                                    <label className="block text-charcoal mb-2">Expiry Date</label>
                                                    <input 
                                                        type="text" 
                                                        placeholder="MM/YY"
                                                        className="w-full px-4 py-2 border border-sage-green rounded focus:outline-none focus:border-gold"
                                                        value={cardDetails.expiry}
                                                        onChange={(e) => setCardDetails({...cardDetails, expiry: e.target.value})}
                                                    />
                                                </div>
                                                <div>
                                                    <label className="block text-charcoal mb-2">CVV</label>
                                                    <input 
                                                        type="text" 
                                                        placeholder="123"
                                                        className="w-full px-4 py-2 border border-sage-green rounded focus:outline-none focus:border-gold"
                                                        value={cardDetails.cvv}
                                                        onChange={(e) => setCardDetails({...cardDetails, cvv: e.target.value})}
                                                    />
                                                </div>
                                            </div>
                                            <div>
                                                <label className="block text-charcoal mb-2">Name on Card</label>
                                                <input 
                                                    type="text" 
                                                    placeholder="John Doe"
                                                    className="w-full px-4 py-2 border border-sage-green rounded focus:outline-none focus:border-gold"
                                                    value={cardDetails.name}
                                                    onChange={(e) => setCardDetails({...cardDetails, name: e.target.value})}
                                                />
                                            </div>
                                        </div>
                                    )}
                                </div>
                                
                                <div 
                                    className={`payment-method ${paymentMethod === 'paypal' ? 'selected' : ''}`}
                                    onClick={() => setPaymentMethod('paypal')}
                                >
                                    <div className="flex items-center">
                                        <i className="fab fa-paypal text-blue-500 text-xl mr-3"></i>
                                        <div>
                                            <h4 className="serif text-lg text-charcoal">PayPal</h4>
                                            <p className="text-sage-green">Pay with your PayPal account</p>
                                        </div>
                                    </div>
                                </div>
                                
                                <div 
                                    className={`payment-method ${paymentMethod === 'apple' ? 'selected' : ''}`}
                                    onClick={() => setPaymentMethod('apple')}
                                >
                                    <div className="flex items-center">
                                        <i className="fab fa-apple text-charcoal text-xl mr-3"></i>
                                        <div>
                                            <h4 className="serif text-lg text-charcoal">Apple Pay</h4>
                                            <p className="text-sage-green">Pay with Apple Pay</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <div className="bg-white p-6 rounded-lg luxury-shadow luxury-border mb-6">
                            <h3 className="serif text-xl text-charcoal mb-4">Order Summary</h3>
                            <div className="flex justify-between items-center border-b border-sage-green pb-4 mb-4">
                                <span className="text-charcoal">Order Total</span>
                                <span className="serif text-xl text-dark-green">${orderTotal}</span>
                            </div>
                            <div className="flex justify-between items-center">
                                <span className="text-charcoal font-semibold">Total to Pay</span>
                                <span className="serif text-2xl text-dark-green font-bold">${orderTotal}</span>
                            </div>
                        </div>
                        
                        <div className="flex space-x-4">
                            <button 
                                className="flex-1 bg-sage-green text-cream py-3 rounded serif text-lg hover:bg-opacity-90 transition-colors"
                                onClick={onBack}
                            >

                                        <i className="fas fa-arrow-right mr-2"></i>Continue Shopping
                                    </button>
                                </div>
                            </div>

                                            'bg-gray-200 text-gray-500'

                                                index + 1
                                            )}
                                        </div>
                                        {index < 2 && <div className="w-16 h-1 bg-sage-green mx-2"></div>}
                                    </div>
                                ))}
                            </div>
                            
                            {/* Shipping Step */}
                            {checkoutStep === 'shipping' && (
                                <div className="fade-in-left">

                                                        name="firstName"

                                                    />

                                            </div>
                                            <div className="mb-4">

                                            <div className="mb-4">

                                {cart.map((item, index) => (
                                    <div 
                                        key={`${item.id}-${index}`}

                                        <div className="w-20 h-20 overflow-hidden rounded luxury-border">

                                <button 
                                    className="w-full btn-luxury py-3 rounded serif text-lg mt-6"
                                    onClick={() => setCurrentPage('checkout')}

                                        <i className="fab fa-pinterest"></i>
                                    </a>
                                    <a href="#" className="text-sage-green hover:text-gold text-lg">

                        </div>
                    </div>

            );
            
            // Render current page
            const renderPage = () => {
                switch(currentPage) {
                    case 'home':
                        return <HomePage />;
                    case 'shop':
                        return <ShopPage />;
                    case 'product-detail':
                        return <ProductDetailPage />;
                    case 'about':
                        return <AboutPage />;
                    case 'contact':
                        return <ContactPage />;
                    case 'cart':
                        return <CartPage />;
                    case 'checkout':
                        return <CheckoutProcess />;
                    case 'admin-dashboard':
                        return <AdminDashboard />;
                    default:
                        return <HomePage />;
                }
            };
            
            return (
                <div className="min-h-screen flex flex-col">

                    <main className="flex-grow">
                        {renderPage()}

                    {!isAdmin && <Footer />}
                </div>
            );
        }

        // Render the app
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
